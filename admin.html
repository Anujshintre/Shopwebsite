<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f6efe6}.card{margin-bottom:1rem}.prev{height:70px;width:70px;object-fit:cover;border-radius:6px;border:1px solid #ccc}h5{color:#7a0f1f}</style></head>
<body>
<div class="container py-4" style="max-width:860px">
  <div id="login" class="card p-4"><h4>Admin login</h4>
    <input id="pw" type="password" class="form-control my-2" placeholder="Password">
    <button class="btn btn-danger" id="go">Log in</button><small id="err" class="text-danger mt-2"></small></div>
  <div id="panel" hidden>
    <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
      <h4 class="me-auto m-0">Edit website content</h4>
      <a class="btn btn-outline-dark btn-sm" href="index.html" target="_blank">View site</a>
      <button class="btn btn-outline-dark btn-sm" id="exp">Export JSON</button>
      <label class="btn btn-outline-dark btn-sm m-0">Import JSON<input type="file" id="imp" accept=".json" hidden></label>
      <button class="btn btn-outline-danger btn-sm" id="rst">Reset to default</button>
    </div>
    <div id="msg" class="alert alert-success py-2" hidden>Saved</div>
    <div id="form"></div>
  </div>
</div>
<script src="js/data.js"></script>
<script>
const PASSWORD = "admin123"; // change this before deploying
let D = loadData();
const S = [ // [section title, [[path, label, type]]]
 ["Shop", [["shop.name","Shop name"],["shop.tagline","Tagline"],["shop.logo","Logo","img"]]],
 ...[0,1,2].map(i=>["Hero slide "+(i+1),[[`hero.${i}.img`,"Image (landscape)","img"],[`hero.${i}.title`,"Title"],[`hero.${i}.sub`,"Subtitle"]]]),
 ["Collection strip",[["strip.title","Heading"],["strip.text","Text","area"],["strip.images.0","Image 1","img"],["strip.images.1","Image 2","img"]]],
 ["Shop by occasion",[["occasionsTitle","Section title"],...[0,1,2,3].flatMap(i=>[[`occasions.${i}.label`,`Card ${i+1} label`],[`occasions.${i}.img`,`Card ${i+1} image (portrait)`,"img"]])]],
 ["Woven with tradition",[["craft.title","Heading"],["craft.text","Text","area"],["craft.imgLarge","Large left image (portrait)","img"],["craft.imgSmall","Small image","img"]]],
 ...[0,1,2].map(i=>["Review "+(i+1),[[`reviews.${i}.name`,"Customer name"],[`reviews.${i}.text`,"Review","area"],[`reviews.${i}.img`,"Photo (square)","img"]]]),
 ["Contact & location",[["contact.phone","Phone"],["contact.whatsapp","WhatsApp (country code + number, no +)"],["contact.address","Address","area"],["contact.hours","Opening hours"],["contact.instagram","Instagram handle (no @)"],["contact.mapQuery","Map search text (e.g. shop name + city)"]]]
];
const get=(p)=>p.split(".").reduce((o,k)=>o?.[k],D);
const set=(p,v)=>{const k=p.split(".");const l=k.pop();k.reduce((o,x)=>o[x],D)[l]=v;};
function flash(ok){const m=document.getElementById("msg");m.className="alert py-2 "+(ok?"alert-success":"alert-danger");m.textContent=ok?"Saved":"Not saved: browser storage is full. Use a smaller image.";m.hidden=false;setTimeout(()=>m.hidden=true,2000);}
function compress(file,max=1400){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72));};i.src=r.result;};r.readAsDataURL(file);});}
function render(){
  const f=document.getElementById("form");f.innerHTML="";
  S.forEach(([t,fs])=>{
    const card=document.createElement("div");card.className="card p-3";
    card.innerHTML=`<h5>${t}</h5>`;
    fs.forEach(([p,label,type])=>{
      const w=document.createElement("div");w.className="mb-2";
      const l=document.createElement("label");l.className="form-label small mb-1";l.textContent=label;w.append(l);
      if(type==="img"){
        const row=document.createElement("div");row.className="d-flex gap-3 align-items-center";
        const im=document.createElement("img");im.className="prev";im.src=get(p);
        const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.className="form-control";
        inp.onchange=async()=>{if(!inp.files[0])return;const u=await compress(inp.files[0]);set(p,u);im.src=u;flash(saveData(D));};
        row.append(im,inp);w.append(row);
      }else{
        const inp=document.createElement(type==="area"?"textarea":"input");inp.className="form-control";if(type==="area")inp.rows=3;
        inp.value=get(p)??"";inp.oninput=()=>{set(p,inp.value);flash(saveData(D));};w.append(inp);
      }
      card.append(w);
    });
    f.append(card);
  });
}
function open(){document.getElementById("login").hidden=true;document.getElementById("panel").hidden=false;render();}
document.getElementById("go").onclick=()=>{if(document.getElementById("pw").value===PASSWORD){sessionStorage.setItem("adm","1");open();}else document.getElementById("err").textContent="Wrong password";};
document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")document.getElementById("go").click();};
if(sessionStorage.getItem("adm"))open();
document.getElementById("rst").onclick=()=>{if(confirm("Remove all edits and restore the default content?")){localStorage.removeItem(KEY);D=loadData();render();}};
document.getElementById("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}));a.download="shopData.json";a.click();};
document.getElementById("imp").onchange=e=>{const r=new FileReader();r.onload=()=>{try{D=merge(DEFAULT_DATA,JSON.parse(r.result));flash(saveData(D));render();}catch(x){alert("Invalid JSON file");}};r.readAsText(e.target.files[0]);};
</script></body></html>
